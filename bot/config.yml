version: "3.1"

language: ru

pipeline:
- name: WhitespaceTokenizer
- name: RegexFeaturizer
- name: LexicalSyntacticFeaturizer
- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 2
  max_ngram: 4
- name: CountVectorsFeaturizer
  analyzer: word
- name: DIETClassifier
  epochs: 300
  learning_rate: 0.001
  constrain_similarities: true
  embedding_dimension: 50
  hidden_layers_sizes:
    text: [128, 64]

policies:
- name: MemoizationPolicy
- name: RulePolicy
- name: TEDPolicy
  max_history: 5
  epochs: 150
  constrain_similarities: true
assistant_id: 20250426-213905-adaptive-vinegar
