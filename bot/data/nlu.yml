version: "3.1"

nlu:
- intent: greet
  examples: |
    - Привет
    - Здравствуйте
    - Добрый день
    - Хай
    - Приветствую

- intent: goodbye
  examples: |
    - Пока
    - До свидания
    - Увидимся
    - Всего хорошего
    - До встречи

- intent: ask_architecture
  examples: |
    - Расскажите об архитектуре ПО
    - Что такое микросервисная архитектура?
    - Как выбрать архитектуру программного обеспечения?
    - Какие архитектурные паттерны существуют?
    - Чем отличается монолит от микросервисов?

- intent: affirm
  examples: |
    - Да
    - Конечно
    - Верно
    - Согласен
    - Абсолютно

- intent: deny
  examples: |
    - Нет
    - Не согласен
    - Неверно
    - Отказываюсь
    - Не хочу

- intent: request_info
  examples: |
    - Расскажите подробнее
    - Можете уточнить?
    - Хотелось бы узнать больше
    - Дайте больше информации
    - Объясните подробнее
